name: Android APK - NES Smart Files
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**','README.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Load llama.cpp Android module
        run: bash scripts/fetch-llama.sh
      - name: Set Android 12 minimum SDK
        run: |
          sed -i "s/minSdk = 33/minSdk = 31/" vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          grep -n "minSdk" vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NES-Smart-Files-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: vendor/llama-ref.txt
          if-no-files-found: ignore
